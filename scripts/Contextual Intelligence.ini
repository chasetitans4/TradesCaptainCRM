Document Status: ACTIVE SPECIFICATION
Last Updated: February 2026
Owner: Product Team

Executive Summary
This specification defines the Contextual Intelligence Layer (CIL)—a system that makes TradesCaptain feel like it's thinking ahead for the technician. Rather than adding more screens, more navigation, or more features to remember, CIL surfaces the right information at the right moment, inline with what the user is already doing.

Core Philosophy
Features don't go to screens. Features come to the user. The app anticipates needs based on where the user is in their workflow and surfaces gentle, dismissible nudges that feel helpful—never intrusive.


What This Specification Covers
The Nudge System: A unified architecture for contextual prompts
Job Briefing Card: Everything a tech needs to know before arriving
Promise Keeper: Never forget a customer commitment again
Quiet Customer Flag: Identify customers ripe for re-engagement
Maintenance Agreement Tracker: Honest recurring service reminders
"While I'm Here" Suggestions: Service history insights at invoice time
Contextual Navigation: Smart 'Go Back' that preserves context

