Quiet Customer Flag
The Quiet Customer Flag identifies customers who haven't engaged with your business in a specified period—not for aggressive marketing, but for genuine, service-oriented re-engagement.

The Retention Philosophy
This is not a sales tool. It's a service tool. The goal is to be the contractor who remembers, who checks in, who genuinely cares about maintaining equipment—not the one who spam-calls for upsells.


Detection Logic
// Customer is flagged as "quiet" when:
const isQuietCustomer = (customer: Customer): boolean => {
  const lastActivity = getLastActivityDate(customer.id);
  const thresholdDays = customer.tier === 'vip' ? 180 : 365;
  const daysSinceActivity = daysBetween(lastActivity, today);
  
  return daysSinceActivity >= thresholdDays 
    && customer.status === 'active'
    && !customer.doNotContact;
};
 
// "Activity" includes:
// - Completed job
// - Paid invoice
// - Inbound call/text
// - Scheduled (not cancelled) appointment
// Does NOT include:
// - Outbound marketing
// - Automated reminders sent
// - Quote sent (unless accepted)


