Suggestion Generation Logic
interface WhileImHereSuggestion {
  customerId: string;
  jobId: string;
  suggestions: Array<{
    type: 'equipment_age' | 'recurring_issue' | 'tech_note' | 'no_agreement';
    priority: number;           // 1-10
    headline: string;           // Short display text
    detail: string;             // Expanded explanation
    source: {
      jobId?: string;
      equipmentId?: string;
      noteText?: string;
      noteDate?: Date;
      noteTech?: string;
    };
  }>;
}
 
// Priority scoring
const scoreSuggestion = (suggestion): number => {
  let score = 0;
  
  // Equipment age (higher = older = more relevant)
  if (suggestion.type === 'equipment_age') {
    const age = currentYear - suggestion.source.installYear;
    const threshold = EQUIPMENT_THRESHOLDS[suggestion.source.equipmentType];
    score += (age / threshold) * 5; // Max 5 points at 100% of lifespan
  }
  
  // Recurring issues (more occurrences = higher priority)
  if (suggestion.type === 'recurring_issue') {
    score += Math.min(suggestion.occurrences * 2, 6); // Max 6 points
  }
  
  // Recent tech notes (more recent = more relevant)
  if (suggestion.type === 'tech_note') {
    const monthsAgo = monthsBetween(suggestion.source.noteDate, today);
    score += Math.max(4 - monthsAgo, 1); // Max 4 points if recent
  }
  
  return score;
};


Contextual Navigation
Technicians don't work linearly. They jump around, get interrupted, need to check something and come back. The navigation system must preserve context and make "going back" intuitive.

The "Go Back" Philosophy
Core Principle
Every screen deeper than the main nav should have a clear escape to wherever the user came from. Not just "back to home"—back to context.


Navigation Stack Behavior
// Navigation context is maintained in a stack
interface NavigationContext {
  stack: Array<{
    route: string;
    label: string;              // Human-readable for back button
    params: Record<string, any>;
    scrollPosition?: number;    // Restore scroll on return
  }>;
  maxDepth: 5;                  // Prevent infinite depth
}
 
// Example stack progression:
// 1. User on Schedule
//    Stack: [{ route: '/schedule', label: 'Schedule' }]
//
// 2. Taps into a job
//    Stack: [{ route: '/schedule', label: 'Schedule' }, 
//            { route: '/job/123', label: 'Johnson Job' }]
//
// 3. Opens invoice builder
//    Stack: [{ route: '/schedule', label: 'Schedule' }, 
//            { route: '/job/123', label: 'Johnson Job' },
//            { route: '/job/123/invoice', label: 'Invoice' }]
//
// Back button shows: "← Back to Johnson Job"
// Tapping goes to /job/123, restores scroll position


Back Button Rendering
// Back button component
const BackButton = () => {
  const { stack } = useNavigation();
  const previousScreen = stack[stack.length - 2];
  
  if (!previousScreen) return null; // At root, no back button
  
  return (
    <TouchableOpacity onPress={() => navigateBack()}>
      <Text>← Back to {previousScreen.label}</Text>
    </TouchableOpacity>
  );
};
 
// Renders as:
// "← Back to Schedule"
// "← Back to Johnson Job"  
// "← Back to Customer"
// etc.


Edge Cases
Scenario
Behavior
Rationale
User at root (Schedule/Customers/Inbox)
No back button shown
Already at top level
Deep link from notification
Back goes to logical parent
Push notification to job → back to schedule
Stack exceeds max depth
Oldest entries pruned
Prevents memory issues
Same screen revisited
Deduplicate in stack
Prevents "back" loops
Cross-entity navigation
Clear context, start new stack
Customer A → Customer B = new context


Gesture Support
In addition to the visible back button:

iOS: Edge swipe from left navigates back (native behavior, should work automatically)
Android: System back button navigates back (must be wired to navigation stack)
Web: Browser back button works correctly (history API integration)

