# 2. AGENT CONSULTING PLAYBOOK

## How to Consult: The Discovery Framework

### Step 1: Understand Their Current Situation

**Questions to Ask:**

```
BUSINESS BASICS:
□ "What trade are you in?" (plumber, HVAC, electrician, roofer, etc.)
□ "How long have you been in business?"
□ "How many jobs do you do per month?"
□ "Is it just you, or do you have a team?"

CURRENT TOOLS:
□ "Do you have a website right now?"
□ "How do you currently keep track of leads and customers?"
□ "What happens when you miss a phone call?"
□ "How do customers find you?" (referrals, Google, ads, etc.)

PAIN POINTS:
□ "What's your biggest frustration with running the business side?"
□ "Have you ever lost a job because you couldn't respond fast enough?"
□ "How much time do you spend on paperwork vs. actual work?"

GOALS:
□ "Where do you want to be in 12 months?"
□ "How many more jobs per month would make a real difference?"
□ "What would it mean if you could stop worrying about missed calls?"
```

### Step 2: Match Pain Points to Plans

| If they say... | Recommend... | Why |
|----------------|--------------|-----|
| "I miss calls all the time" | **NeverMiss** ($29) | Solves the immediate problem |
| "I forget to follow up with leads" | **Blue CRM** ($49+) | Tracks everything |
| "My website is embarrassing" | **Web** ($149+) | Professional online presence |
| "I need help with everything" | **Silver** or **Gold** | Bundled value |
| "I'm not showing up on Google" | **Local SEO** ($99+) | Get found locally |
| "I want to grow but I'm overwhelmed" | **Gold + Local SEO** | Full solution |

### Step 3: The Recommendation Script

**For NeverMiss ($29/mo):**
```
"Based on what you told me about missing calls, I'd start with NeverMiss. 
It's $29/month and here's what happens: when you miss a call, our AI 
instantly texts them back, asks what they need, and can even book an 
appointment. Most plumbers recover $2,000+ in jobs they would have lost.
You can try it free for 14 days."
```

**For Blue CRM ($49-199/mo):**
```
"You mentioned you're using sticky notes and your memory to track jobs. 
Blue CRM will change that. You'll see every lead, every job, every 
follow-up in one place. Works on your phone too. Start at $49/month — 
you'll wonder how you lived without it."
```

**For Web ($149-349/mo):**
```
"Your website is the first thing customers see. Right now, it's either 
outdated or doesn't exist. For $149/month, we'll build you a professional 
site that looks great, works on phones, and actually helps you get found 
on Google. It pays for itself with one extra job."
```

**For Silver Bundle ($199-449/mo):**
```
"Here's what I'd recommend: the Silver bundle. You get a professional 
website, NeverMiss so you never lose a call, and a basic CRM to track 
everything. Instead of $227 separately, it's $199/month. It's everything 
you need to look professional and stop losing leads."
```

**For Gold Bundle ($249-549/mo):**
```
"You said you want to grow. Gold gives you everything: website, NeverMiss, 
full CRM with all the features, and priority support. It's the 'I'm serious 
about my business' package. $249/month — cheaper than hiring help, and 
it works 24/7."
```

**For Local SEO ($99-199/mo):**
```
"You said customers can't find you on Google. That's what Local SEO fixes. 
We'll get you listed on 50+ directories, manage your Google reviews, and 
track your rankings. Most clients hit the Google 3-pack within 90 days. 
Starts at $99/month."
```

### Step 4: Handle Objections

| Objection | Response |
|-----------|----------|
| "That's too expensive" | "What's one missed job worth to you? This pays for itself with one job." |
| "I need to think about it" | "Totally understand. What questions can I answer right now to help you decide?" |
| "I'm not tech-savvy" | "That's exactly why we built this. It's designed for contractors, not tech people. I'll walk you through everything." |
| "I tried something like this before" | "What didn't work? We're built specifically for trades — not generic software that doesn't fit." |
| "Can I start small?" | "Absolutely. Start with NeverMiss at $29. You can always add more later." |
| "Do I need all of this?" | "No, start with what hurts most. Missing calls? NeverMiss. No website? Web. We can grow together." |

### Step 5: Close the Sale

**The Assumptive Close:**
```
"Alright, let's get you set up. I'll need your business name, phone number, 
and email. Which plan are we starting with — the [recommended plan]?"
```

**The Choice Close:**
```
"So it sounds like [Plan A] or [Plan B] would both work for you. 
Which one feels like the better fit right now?"
```

**The Urgency Close (if applicable):**
```
"If we get you started today, you could have this live by [tomorrow/next week]. 
That means no more missed calls starting [date]. Let's do it."
```

