Promise Keeper
Promise Keeper is a lightweight follow-up system that ensures verbal commitments to customers don't fall through the cracks. Most contractors lose trust not through bad work, but through forgotten follow-ups.

The Trust Insight
When a tech says "I'll send that quote Tuesday," the customer remembers. If Tuesday comes and goes with no quote, trust erodes—even if the work was perfect. Promise Keeper is about keeping your word.


How It Works
Creating a Promise
Promises can be created in three contexts:

End of Job Flow: After completing a job, a subtle prompt asks "Add a follow-up reminder?"
Notes Field: When adding a note with time-related keywords ("Tuesday," "next week," "follow up"), the app suggests creating a promise.
Customer Quick Action: From customer detail screen, tap "+ Promise" to manually create.

