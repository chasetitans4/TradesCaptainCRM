## Common Tasks: How to Do Them

### How to Add a Lead

```
1. Click "+ Add Lead" button (top right)
2. Enter name and phone (required)
3. Enter what they need (be specific!)
4. Save
```

### How to Send an Estimate/Quote

```
1. Open the lead's profile
2. Click "Create Estimate"
3. Add line items (services, materials)
4. Add notes or terms
5. Click "Send" (emails PDF to customer)
```

### How to Schedule a Job

```
1. Open the lead's profile
2. Click "Schedule Job"
3. Pick date and time
4. Add job notes
5. Save (automatically adds to calendar)
```

### How to Mark a Job Complete

```
1. Open the job
2. Click "Mark Complete"
3. Add any final notes
4. Job moves to "Completed" stage
```

### How to Send an Invoice

```
1. Open the completed job
2. Click "Create Invoice"
3. Verify amounts (pulls from estimate)
4. Add any additional charges
5. Click "Send Invoice"
```

### How to Check Who Needs Follow-Up

```
1. Go to Dashboard
2. Look at "Needs Attention" section
3. See leads that haven't been contacted
4. See quotes that haven't been responded to
5. Click to take action
```

