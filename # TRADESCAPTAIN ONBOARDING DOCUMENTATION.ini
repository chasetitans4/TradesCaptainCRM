# 5. BEGINNER'S GUIDE TO USING THE CRM

## Your First Week: Day-by-Day Guide

### Day 1: Get Oriented

**Log in and look around (15 min)**

```
DASHBOARD
┌─────────────────────────────────────────────────────────────────────────┐
│ Welcome, Mike! Here's your business at a glance.                        │
├─────────────────────────────────────────────────────────────────────────┤
│                                                                         │
│ ┌─────────────┐ ┌─────────────┐ ┌─────────────┐ ┌─────────────┐        │
│ │ NEW LEADS   │ │ SCHEDULED   │ │ THIS MONTH  │ │ REVENUE     │        │
│ │     5       │ │     3       │ │    12 jobs  │ │   $8,400    │        │
│ └─────────────┘ └─────────────┘ └─────────────┘ └─────────────┘        │
│                                                                         │
│ TODAY'S TASKS                                                           │
│ □ Follow up with John Smith (quoted yesterday)                          │
│ □ Send estimate to ABC Company                                          │
│ □ Call back: Mary (missed call at 2:15pm)                               │
│                                                                         │
└─────────────────────────────────────────────────────────────────────────┘
```

**What each section means:**
- **New Leads:** People who contacted you but haven't been qualified yet
- **Scheduled:** Jobs on your calendar
- **This Month:** Jobs completed this month
- **Revenue:** Money earned this month
- **Today's Tasks:** What you need to do today

### Day 2: Add Your First Lead

**When someone calls or texts you, add them immediately:**

```
ADD NEW LEAD
┌─────────────────────────────────────────────────────────────────────────┐
│                                                                         │
│ Name: [John Smith_____________]                                         │
│ Phone: [(214) 555-1234________]                                         │
│ Email: [john@email.com________] (optional)                              │
│                                                                         │
│ What do they need?                                                      │
│ [Leaky faucet in kitchen, water damage under sink_______________]       │
