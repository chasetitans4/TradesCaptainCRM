This document is the single source of truth for the Contextual Intelligence Layer. All implementation decisions should reference this specification.


Contextual Intelligence Layer: Nudge System Specification
Overview
Implement a Contextual Intelligence Layer for the TradesCaptain mobile app that surfaces relevant information and actions to technicians at the right moment in their workflow—without adding navigation complexity or requiring them to remember features exist.
This system is called Nudges. Nudges are inline, contextual prompts that appear within screens the user is already on, based on job lifecycle stage, customer history, and technician behavior.

Core Principles

Contextual, not navigational — Nudges appear inline on existing screens. They do not occupy nav slots or require the user to "go somewhere" to see them.
Subtle, not aggressive — Nudges use link-weight styling (not buttons). They inform without demanding action. They are easily ignored without friction.
Dismissible without penalty — Users can dismiss nudges. Dismissed nudges do not reappear for that context (that job, that customer) unless conditions change.
Lifecycle-aware — The system knows where the user is in the job flow (pre-arrival, on-site, wrapping up, post-job) and surfaces nudges accordingly.
Escape-first navigation — Every screen reached via a nudge (or any drill-down) includes a "← Back to [Previous Context]" link that returns the user to exactly where they came from, not a generic home screen.


Features to Implement
1. Job Briefing Card
What: A single-screen summary shown when a technician taps into a job from the schedule.
Contains:

Customer name, address, contact info
Gate codes, dog warnings, access notes
Service history summary (last 3 visits, one line each)
Payment behavior flag (if relevant): "Typically pays on-site" or "Has outstanding balance"
Any prior complaints or notes flagged as important
Active maintenance agreement status (if applicable)

UX:

This IS the job landing screen—not a separate feature to navigate to
Primary action: "Start Job" or "View Details"
Secondary action: "Call Customer" / "Get Directions"


2. Quiet Customer Flag
What: A subtle inline indicator when viewing a customer who hasn't booked in 12+ months.
Appears on:

Customer detail screen
Job Briefing Card (if this job breaks a long silence)

Display:

Small badge or inline note: 🕐 Last service: 14 months ago
Optional subtle link: "Send check-in message →" (opens pre-filled SMS template)

Logic:

Threshold: 12 months since last completed job
Flag clears automatically when a new job is completed


3. Promise Keeper
What: A one-tap way to set a follow-up reminder when a technician makes a commitment to a customer.
Appears on:

Job notes field (after typing a note that contains follow-up language)
End-of-job summary screen
Customer detail screen (manual add)

Trigger detection (optional smart prompt):

If note contains phrases like "will send quote," "follow up," "call back," "check on," surface: ⏰ Set a reminder?

Interaction:

Tap to open quick date picker (Today, Tomorrow, This Week, Custom)
Reminder appears in technician's task list or as a push notification
Completed/snoozed states

Display:

Inline link below notes field: + Add follow-up reminder
If smart-triggered: ⏰ Remind you to follow up?


4. Maintenance Agreement Tracker
What: Surface active maintenance agreements and prompt setup where relevant.
Appears on:

Customer detail screen (dedicated small section)
Job Briefing Card (if agreement exists: "Covered under maintenance agreement")

If agreement exists:

Show: Agreement type, next scheduled service date, any notes
Link: "View agreement details →"

If no agreement:

Subtle nudge: 📋 No maintenance agreement — Set one up?
Only show this nudge if customer has 2+ completed jobs (qualified)


5. While I'm Here Suggestions
What: Surface relevant notes from previous visits that might prompt additional work discussion.
Appears on:

Invoice builder screen (subtle link above or below line items)
End-of-job summary screen

Display:

Link: 💡 Notes from previous visits →
Expands inline (or slides up a half-sheet) showing:

Equipment age notes ("Water heater installed 2015 — 9 years old")
Technician observations ("Noted corrosion on supply lines 6/12/24")
Customer-mentioned concerns ("Customer asked about water softener options")



Logic:

Pull from job notes flagged as "observation" or containing equipment age data
Do not show if no relevant notes exist (nudge doesn't appear, not empty state)

Interaction:

Technician can tap a suggestion to add it as a line item or note on current job
Or simply read and dismiss


Navigation: Back Button Specification
Rule: Every screen that is not a root-level tab must display a "← Back to [Context Name]" link in the top-left header area.
Behavior:

Back link returns user to the exact screen they came from, preserving scroll position and state where possible
Label is dynamic: "← Back to Schedule" / "← Back to Johnson Job" / "← Back to Invoice"
If navigation stack is 3+ deep, consider breadcrumb display: Schedule › Johnson Job › Invoice
Support swipe-from-left-edge gesture as equivalent to tapping back

Edge cases:

If user arrived via push notification, back goes to the relevant root tab (Schedule, Customers, etc.)
If context no longer exists (job deleted), back goes to parent list with a subtle toast: "Job no longer available"


