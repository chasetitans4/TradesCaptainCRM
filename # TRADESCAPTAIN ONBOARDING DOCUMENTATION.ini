# 3. USER ONBOARDING BY PLAN

## NeverMiss Onboarding ($29/mo)

### What You'll Need to Provide:
- Business phone number
- Business name
- Your personal cell (for notifications)
- Business hours (when you want AI to respond)

### Setup Process (Takes ~15 minutes):

```
STEP 1: Account Creation (2 min)
→ Sign up at tradescaptain.com/nevermiss
→ Enter business info
→ Choose your plan

STEP 2: Connect Your Phone (5 min)
→ We'll give you a new business number, OR
→ Forward your existing number to our system
→ Test call to confirm it's working

STEP 3: Customize AI Responses (5 min)
→ Tell us what services you offer
→ Set your business hours
→ Choose how aggressive AI should be (just info vs. book appointments)

STEP 4: Test It (3 min)
→ Call your business number
→ Don't answer
→ Watch the AI text back instantly
→ You're live!
```

### What to Expect in Week 1:
- AI will handle 5-15 missed calls
- You'll get notifications for each conversation
- Review AI conversations to see what customers are asking
- Adjust AI responses if needed

### Success Metrics:
- Response time: Under 60 seconds (vs. hours/never before)
- Lead capture rate: 70-80% of missed calls turn into conversations
- Expected ROI: 2-5 recovered jobs in first month

