Test Definitions (Reference)
Marketing Test: Can this feature be clearly explained and demonstrated in 30 seconds to a contractor who's never seen the product?
Explanation Test: Can a user understand what this feature does and why they'd want it in a single sentence?
Trust Test: Does this feature help the contractor build trust with their customers, or does it feel manipulative, pushy, or sleazy?
Deletion Test: If we removed this feature tomorrow, would the rest of the system still function correctly? (No hard dependencies)

Implementation Roadmap
Features are sequenced by dependency order and value delivery. Earlier phases create infrastructure; later phases add intelligence.

Phase 1: Foundation (Week 1-2)
Build the underlying systems that other features depend on.

Navigation Stack: Implement context-preserving navigation with "Go Back" functionality
Nudge Infrastructure: Data model, storage, dismissal tracking, placement zones
Nudge Component: Reusable UI component with all four visual types

Phase 2: Core Features (Week 3-4)
Deliver the highest-impact user-facing features.

Job Briefing Card: Replace current job detail view with briefing-first design
Promise Keeper: Full CRUD, keyword detection, schedule integration
Promise Nudges: Connect promises to nudge system for surfacing

Phase 3: Intelligence (Week 5-6)
Add smart detection and proactive insights.

Quiet Customer Detection: Background job to flag inactive customers
Quiet Customer Nudges: Surface flags on customer list and detail screens
"While I'm Here" Engine: Service history analysis and suggestion generation
Invoice Integration: Notes drawer on invoice builder

Phase 4: Agreements (Week 7-8)
