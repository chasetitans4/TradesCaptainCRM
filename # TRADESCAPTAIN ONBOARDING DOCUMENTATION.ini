## TOOLTIPS AND HELPER TEXT

### Dashboard
- New Leads: "Leads who contacted you but haven't been qualified yet. These need your attention first."
- Revenue: "Total invoiced amount for completed jobs this month."
- Today's Tasks: "Actions you need to take today. Complete these to keep leads moving."

### Pipeline
- New: "Someone expressed interest but you haven't contacted them yet. Speed is critical here."
- Contacted: "You've talked to them. Next step: qualify and quote."
- Quoted: "You sent a price. Follow up if you don't hear back in 2-3 days."
- Scheduled: "Job is on the calendar. Make sure you have all the info you need."
- Completed: "Job is done. Don't forget to send the invoice!"
- Paid: "You got paid. Congratulations! Consider asking for a review."

### Lead Profile
- Source: "Where this lead came from. Helps you know what marketing is working."
- Notes: "Add everything you learn. Future you will thank present you."
- Next Action: "What needs to happen next? Set a reminder so it doesn't slip."

### Estimates
- Line Items: "Break down your quote into parts: labor, materials, etc. Transparency builds trust."
- Notes: "Include scope, timeline, and terms. Clarity prevents disputes later."

### NeverMiss
- AI Conversations: "See every text conversation the AI has had. You can take over anytime."
- Hot Lead: "This person expressed strong interest or urgency. Contact them ASAP."
- Response Rate: "Percentage of missed calls where the customer texted back. Industry average is 50%."
