Acceptance Criteria

 Job Briefing Card is the default landing view when tapping a job from schedule
 Quiet Customer flag appears on qualifying customer records without manual activation
 Promise Keeper allows setting a reminder in ≤3 taps from the job notes field
 Maintenance Agreement section appears on customer detail; setup prompt shows for qualified customers only
 While I'm Here link appears on invoice screen only when relevant suggestions exist
 All drill-down screens include contextual back navigation
 Nudges are visually subtle (link-weight, muted color) and do not compete with primary actions
 Dismissed nudges persist dismissal state appropriately (per-job, per-customer, or per-note as specified)


Out of Scope (For Now)

Push notification delivery for Promise Keeper (can stub with in-app task list first)
AI-powered detection of follow-up language (can start with manual "Add reminder" only)
Reporting/analytics on nudge engagement

