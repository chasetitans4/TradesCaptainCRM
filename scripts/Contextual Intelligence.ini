Maintenance Agreement Tracker
The Maintenance Agreement Tracker ensures recurring service commitments are honored—both by the contractor (proactive reminders) and the customer (renewal opportunities). This is honest, opt-in service scheduling.

Agreement Lifecycle
State
Definition
System Behavior
Active
Agreement in effect, services available
Normal operation, track service credits
Expiring
30 days or less until expiration
Status nudge on customer screens, renewal prompt
Expired
Past expiration date
No services, prominent renewal CTA
Renewed
Customer renewed for another term
Transition to Active, reset service credits


Service Reminder Logic
// When to remind customer of scheduled maintenance
interface MaintenanceSchedule {
  agreementId: string;
  customerId: string;
  services: Array<{
    type: 'spring_tuneup' | 'fall_tuneup' | 'filter_change' | 'inspection';
    scheduledMonth: number;     // 1-12
    completed: boolean;
    completedDate?: Date;
    jobId?: string;
  }>;
}
 
// Generate reminders
const generateMaintenanceReminders = (schedule: MaintenanceSchedule) => {
  const currentMonth = new Date().getMonth() + 1;
  
  schedule.services
    .filter(s => !s.completed && s.scheduledMonth === currentMonth)
    .forEach(service => {
      createNudge({
        type: 'status',
        entityType: 'agreement',
        entityId: schedule.agreementId,
        message: `${service.type} due this month for ${customer.name}`,
        actionLabel: 'Schedule service',
        actionRoute: `/schedule/new?customerId=${schedule.customerId}&type=${service.type}`,
        source: 'maintenance_tracker'
      });
    });
};


Customer-Facing Communication
When the system sends maintenance reminders to customers (via SMS or email), it always:

References the agreement they signed: "Per your maintenance agreement..."
Explains the service: "Your spring AC tune-up helps prevent summer breakdowns."
Provides easy scheduling: Link to self-scheduling or text-to-schedule.
Respects opt-out: Clear way to decline or reschedule.

"While I'm Here" Suggestions
"While I'm Here" surfaces relevant service history insights at the moment a technician is wrapping up a job—specifically, when building an invoice. This is not upselling; it's informed service.

The Difference
Upselling: "Hey, want to buy a new AC?" | While I'm Here: "Last visit, you noted their AC unit is 12 years old. They might appreciate knowing about maintenance options."


When It Appears
The "While I'm Here" nudge appears only on the Invoice Builder screen, positioned subtly above the line items. It draws from:

Previous job notes: Technician observations from past visits
Equipment age: Items approaching end-of-life thresholds
Recurring issues: Same equipment flagged multiple times
No maintenance agreement: Customer with aging equipment, no agreement

