└─────────────────────────────────────────────────────────────────────────┘
```

**Pro tip:** Add leads RIGHT AWAY. If you wait until later, you'll forget details.

### Day 3: Move Leads Through Your Pipeline

**Your pipeline shows where every lead is:**

```
PIPELINE VIEW
┌─────────────────────────────────────────────────────────────────────────┐
│                                                                         │
│ NEW        → CONTACTED  → QUOTED     → SCHEDULED  → COMPLETED → PAID    │
│ ────────────────────────────────────────────────────────────────────────│
│ John S.      Mary T.      Bob R.       Sarah K.     Mike P.     Lisa W. │
│ Jane D.                   Amy L.       Tom H.       Chris M.            │
│ Pete F.                                                                 │
│                                                                         │
└─────────────────────────────────────────────────────────────────────────┘
```

**To move a lead:** Click on their name → Update Status → Select new stage

**What each stage means:**
- **New:** Just came in, haven't talked to them yet
- **Contacted:** You've talked to them
- **Quoted:** You gave them a price
- **Scheduled:** Job is on the calendar
- **Completed:** Job is done
- **Paid:** You got paid!

