The Nudge System
The Nudge System is the architectural foundation that powers all contextual intelligence features. A Nudge is not a notification, not a modal, not a popup—it's a gentle, inline prompt that appears within the screen the user is already viewing.

Nudge Definition
What Is a Nudge?
A Nudge is a contextual prompt that: (1) appears inline on a screen the user is already on, (2) is visually subtle—link-weight, not button-weight, (3) is dismissible without penalty, and (4) never blocks the primary action.


Nudge Anatomy
┌─────────────────────────────────────────────────────────┐
│  [icon]  Nudge message text here                    ✕   │
│          Optional action link →                         │
└─────────────────────────────────────────────────────────┘
 
Components:
├── Icon (optional): Visual category hint (💡📋⏰📝)
├── Message: Single line, <60 characters ideal
├── Dismiss: Always present, never hidden
└── Action Link: Optional deep link to related screen


Nudge Types
Type
Icon
Purpose
Example
Insight
💡
Historical pattern or observation
"Johnson hasn't booked since March 2024"
Reminder
⏰
Time-based follow-up
"Follow up about quote due today"
Suggestion
📋
Actionable opportunity
"AC unit noted as 12 years old last visit"
Status
📝
Agreement or account status
"Maintenance agreement expires in 30 days"


Nudge Behavior Rules
Maximum 2 nudges per screen: More than 2 becomes noise. Prioritize by relevance score.
Dismissal persists: Once dismissed, a nudge doesn't return for that entity/context for 30 days.
Never block primary action: Nudges appear in margins, footers, or between sections—never as modals.
Contextual relevance required: A nudge only appears if it's relevant to the current screen's entity (customer, job, etc.).
Silent failure: If no relevant nudges exist, show nothing. Empty state is valid.

Nudge Data Model
interface Nudge {
  id: string;                    // Unique identifier
  type: 'insight' | 'reminder' | 'suggestion' | 'status';
  entityType: 'customer' | 'job' | 'equipment' | 'agreement';
  entityId: string;              // FK to related entity
  message: string;               // Display text (<60 chars)
  actionLabel?: string;          // Optional CTA text
  actionRoute?: string;          // Deep link destination
  priority: number;              // 1-10, higher = more relevant
  expiresAt?: Date;              // Auto-dismiss after this date
  dismissedAt?: Date;            // When user dismissed
  dismissedUntil?: Date;         // Re-show after this date
  createdAt: Date;
  source: string;                // Which system generated this
}
 
// Nudge sources (what creates them)
type NudgeSource = 
  | 'quiet_customer'        // Customer inactivity detection
  | 'promise_keeper'        // User-created follow-up
  | 'maintenance_tracker'   // Agreement expiration
  | 'equipment_age'         // "While I'm Here" insights
  | 'service_history';      // Previous visit notes


