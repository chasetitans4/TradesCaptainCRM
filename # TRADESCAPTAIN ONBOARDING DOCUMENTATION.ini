## Tips for Success

### The Golden Rules

```
┌─────────────────────────────────────────────────────────────────────────┐
│ 🏆 THE 5 RULES FOR CRM SUCCESS                                          │
├─────────────────────────────────────────────────────────────────────────┤
│                                                                         │
│ 1. ADD EVERY LEAD                                                       │
│    Even if they seem like a long shot. You never know.                  │
│                                                                         │
│ 2. ADD LEADS IMMEDIATELY                                                │
│    While you're on the phone or right after. Details fade fast.         │
│                                                                         │
│ 3. CONTACT LEADS WITHIN 24 HOURS                                        │
│    Speed wins. The first contractor to respond usually gets the job.    │
│                                                                         │
│ 4. UPDATE STATUS EVERY TIME SOMETHING CHANGES                           │
│    Pipeline only helps if it's accurate.                                │
│                                                                         │
│ 5. CHECK YOUR DASHBOARD EVERY MORNING                                   │
│    5 minutes prevents leads from falling through cracks.                │
│                                                                         │
└─────────────────────────────────────────────────────────────────────────┘
```

### What NOT to Do

| Mistake | Why It Hurts |
|---------|--------------|
| Adding leads "later" | You forget details, leads get lost |
| Not updating status | Your pipeline becomes useless |
| Ignoring notifications | Hot leads go cold |
| Only checking CRM weekly | Leads need DAILY attention |
| Not using mobile app | Misses the point — CRM should go with you |

